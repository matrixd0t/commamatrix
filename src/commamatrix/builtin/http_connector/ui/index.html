<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommaMatrix</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--user-bg:#1f2937;--assistant-bg:#161b22;--error:#f85149;--success:#3fb950;--radius:8px;--input-max-height:33vh}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:16px;font-weight:600}
header .status{font-size:12px;color:var(--muted);margin-left:auto}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:var(--radius);word-wrap:break-word;white-space:pre-wrap;line-height:1.5;font-size:14px}
.msg.user{background:var(--user-bg);align-self:flex-end;border-bottom-right-radius:2px}
.msg.assistant{background:var(--assistant-bg);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:2px}
.msg .role{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.msg.reasoning{background:var(--surface);border:1px dashed var(--border);align-self:flex-start;font-size:13px;color:var(--muted)}
.msg.reasoning summary{cursor:pointer;color:var(--accent);font-size:12px}
.msg.tool-call{background:rgba(255,165,0,0.08);border:1px solid rgba(255,165,0,0.4);align-self:flex-start;font-size:13px}
.msg.tool-call summary{cursor:pointer;color:#ffa500;font-size:12px}
.msg.tool-result{background:rgba(63,185,80,0.08);border:1px solid rgba(63,185,80,0.3);align-self:flex-start;font-size:13px}
.msg.tool-result summary{cursor:pointer;color:var(--success);font-size:12px}
.msg.image{background:var(--surface);border:1px solid var(--border);align-self:flex-start;font-size:13px;color:var(--muted)}
.msg.file{background:var(--surface);border:1px solid var(--border);align-self:flex-start;font-size:13px}
.msg.file .icon{color:var(--accent);margin-right:6px}
.msg.error{background:rgba(248,81,73,0.1);border:1px solid var(--error);color:var(--error);align-self:center;font-size:13px}
.msg .placeholder{color:var(--muted);font-style:italic;font-size:13px}
.msg pre{margin:4px 0 0;padding:0;overflow:visible;font-size:12px;line-height:1.4;background:transparent;white-space:pre-wrap;overflow-wrap:anywhere}
.msg code{padding:0;background:transparent;font-size:12px}
.msg.tool-call pre,.msg.tool-result pre{max-height:none}
#input-area{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;flex-shrink:0}
#input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:10px 14px;font-size:14px;font-family:inherit;resize:none;outline:none;min-height:42px;max-height:var(--input-max-height);overflow-y:auto}
#input:focus{border-color:var(--accent)}
#send-btn,#cancel-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;flex-shrink:0}
#send-btn:hover{opacity:0.9}
#send-btn:disabled{opacity:0.4;cursor:not-allowed}
#cancel-btn{background:var(--error);display:none}
.header-actions{display:flex;align-items:center;gap:6px}
.header-actions button{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-size:12px;cursor:pointer}
.header-actions button:hover{border-color:var(--accent);color:var(--accent)}
.auth-overlay{position:fixed;inset:0;background:rgba(13,17,23,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.auth-overlay.hidden{display:none}
.auth-card{width:min(100%,390px);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
.auth-card h2{font-size:20px;margin-bottom:8px}
.auth-card p{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:18px}
.auth-card form{display:flex;flex-direction:column;gap:10px}
.auth-card label{font-size:12px;color:var(--muted)}
.auth-card input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:10px 12px;font:inherit;outline:none}
.auth-card input:focus{border-color:var(--accent)}
.auth-card button{background:var(--accent);color:#fff;border:0;border-radius:var(--radius);padding:10px 14px;font:inherit;cursor:pointer;margin-top:6px}
.auth-card button.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
.auth-error{color:var(--error);font-size:13px;min-height:18px}
.auth-success{color:var(--success);font-size:13px;line-height:1.45;word-break:break-all}
#app-shell{height:100vh;display:flex;flex-direction:column}
body.auth-locked #app-shell{filter:blur(6px);pointer-events:none;user-select:none}
@media(max-width:600px){header{padding:8px 10px;flex-wrap:wrap}.header-actions{width:100%;justify-content:flex-end}.header-actions .status{margin-left:auto}}
.typing{color:var(--muted);font-size:13px;align-self:flex-start;padding:4px 0}
.typing span:not(.codeact-spinner){animation:blink 1.2s infinite}
.msg.codeact{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.4);align-self:flex-start;font-size:13px}
.msg.codeact summary,.msg.codeact .codeact-title{cursor:pointer;color:#a855f7;font-size:12px}
.msg.codeact pre{max-height:none}
.codeact-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(168,85,247,0.3);border-top-color:#a855f7;border-radius:50%;animation:codeact-spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes codeact-spin{to{transform:rotate(360deg)}}
.msg.codeact{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.4);align-self:flex-start;font-size:13px}
.msg.codeact summary,.msg.codeact .codeact-title{cursor:pointer;color:#a855f7;font-size:12px}
.msg.codeact pre{max-height:none}
.codeact-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(168,85,247,0.3);border-top-color:#a855f7;border-radius:50%;animation:codeact-spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes codeact-spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body class="auth-locked">
<div id="app-shell">
<header>
  <h1>CommaMatrix</h1>
  <span class="status" id="status">Sign in required</span>
  <div class="header-actions">
    <span class="status" id="user-label"></span>
    <button id="password-btn" type="button" hidden>Change password</button>
    <button id="invite-btn" type="button" hidden>Add user</button>
    <button id="logout-btn" type="button" hidden>Log out</button>
  </div>
</header>
<div id="messages"></div>
<div id="input-area">
  <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
  <button id="send-btn">Send</button>
  <button id="cancel-btn">Cancel</button>
</div>
</div>
<div class="auth-overlay hidden" id="auth-overlay" style="display:none">
  <div class="auth-card">
    <h2 id="auth-title">Sign in</h2>
    <p id="auth-description">Use your CommaMatrix account to connect to this agent.</p>
    <form id="auth-form">
      <label for="auth-username">Username</label>
      <input id="auth-username" autocomplete="username" required>
      <label for="auth-password">Password</label>
      <input id="auth-password" type="password" autocomplete="current-password" required>
      <label id="auth-confirm-label" for="auth-confirm" hidden>Confirm password</label>
      <input id="auth-confirm" type="password" autocomplete="new-password" hidden>
      <div class="auth-error" id="auth-error"></div>
      <button id="auth-submit" type="submit">Sign in</button>
    </form>
  </div>
</div>
<div class="auth-overlay hidden" id="password-overlay">
  <div class="auth-card">
    <h2>Change password</h2>
    <p>Set a new password for the current account.</p>
    <form id="password-form">
      <label for="old-password">Current password</label>
      <input id="old-password" type="password" autocomplete="current-password" required>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" required>
      <label for="new-password-confirm">Confirm new password</label>
      <input id="new-password-confirm" type="password" autocomplete="new-password" required>
      <div class="auth-error" id="password-error"></div>
      <button type="submit">Change password</button>
      <button class="secondary" id="password-cancel" type="button">Cancel</button>
    </form>
  </div>
</div>
<div class="auth-overlay hidden" id="invite-overlay">
  <div class="auth-card">
    <h2>New user invitation</h2>
    <p>Give this one-time link to the person who should register.</p>
    <div class="auth-success" id="invite-url"></div>
    <button id="invite-copy" type="button">Copy link</button>
    <button class="secondary" id="invite-close" type="button">Close</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" async></script>
<script>
(function(){
const messagesEl=document.getElementById('messages');
const inputEl=document.getElementById('input');
const sendBtn=document.getElementById('send-btn');
const cancelBtn=document.getElementById('cancel-btn');
const statusEl=document.getElementById('status');
const userLabel=document.getElementById('user-label');
const passwordBtn=document.getElementById('password-btn');
const inviteBtn=document.getElementById('invite-btn');
const logoutBtn=document.getElementById('logout-btn');
const authOverlay=document.getElementById('auth-overlay');
const authTitle=document.getElementById('auth-title');
const authDescription=document.getElementById('auth-description');
const authForm=document.getElementById('auth-form');
const authUsername=document.getElementById('auth-username');
const authPassword=document.getElementById('auth-password');
const authConfirmLabel=document.getElementById('auth-confirm-label');
const authConfirm=document.getElementById('auth-confirm');
const authSubmit=document.getElementById('auth-submit');
const authError=document.getElementById('auth-error');
const passwordOverlay=document.getElementById('password-overlay');
const passwordForm=document.getElementById('password-form');
const passwordError=document.getElementById('password-error');
const inviteOverlay=document.getElementById('invite-overlay');
const inviteUrl=document.getElementById('invite-url');
let inviteToken=new URLSearchParams(location.search).get('token');
let authToken=localStorage.getItem('commamatrix_auth_token');
let currentUser=null;
let authMode=inviteToken?'register':'login';

let sessionId=crypto.randomUUID();
let abortController=null;
let currentReader=null;
let cancelled=false;
let sendGen=0;
let lastExternalId=null;
let streamingPreviews={};
let typingIndicator=null;

function setAuthLocked(locked){
  document.body.classList.toggle('auth-locked',locked);
  if(locked){
    authOverlay.classList.remove('hidden');
    authOverlay.style.display='';
  }else{
    authOverlay.classList.add('hidden');
    authOverlay.style.display='none';
  }
}

function setAuthMode(mode){
  authMode=mode;
  const register=mode==='register';
  authTitle.textContent=register?'Create account':'Sign in';
  authDescription.textContent=register?'Use the one-time invitation to create an account.':'Use your CommaMatrix account to connect to this agent.';
  authConfirmLabel.hidden=!register;
  authConfirm.hidden=!register;
  authConfirm.required=register;
  authPassword.autocomplete=register?'new-password':'current-password';
  authSubmit.textContent=register?'Register':'Sign in';
  authError.textContent='';
}

function authHeaders(){return authToken?{Authorization:'Bearer '+authToken}:{};}

async function authFetch(url,options={}){
  const headers={...authHeaders(),...(options.headers||{})};
  return fetch(url,{...options,headers});
}

function showAuth(message=''){
  setAuthMode(inviteToken?'register':'login');
  authError.textContent=message;
  setAuthLocked(true);
  authUsername.focus();
}

function clearAuth(){
  authToken=null;currentUser=null;
  localStorage.removeItem('commamatrix_auth_token');
  messagesEl.replaceChildren();
  sessionId=crypto.randomUUID();lastExternalId=null;
  passwordBtn.hidden=true;inviteBtn.hidden=true;logoutBtn.hidden=true;userLabel.textContent='';statusEl.textContent='Sign in required';
}

function applyUser(user){
  currentUser=user;userLabel.textContent=user.username;passwordBtn.hidden=false;inviteBtn.hidden=!user.is_admin;logoutBtn.hidden=false;statusEl.textContent='Ready';setAuthLocked(false);
}

async function loadCurrentUser(){
  if(!authToken){showAuth();return false}
  const response=await authFetch('/api/me');
  if(!response.ok){clearAuth();showAuth();return false}
  applyUser(await response.json());
  return true;
}

function logout(){clearAuth();showAuth();}

function scrollToBottom(){
  requestAnimationFrame(()=>{messagesEl.scrollTop=messagesEl.scrollHeight});
}

function addMessage(cls,content,role){
  const div=document.createElement('div');
  div.className='msg '+cls;
  if(role){const r=document.createElement('div');r.className='role';r.textContent=role;div.appendChild(r)}
  const c=document.createElement('div');c.textContent=content;div.appendChild(c);
  messagesEl.appendChild(div);scrollToBottom();return div;
}

function addReasoning(content){
  const det=document.createElement('details');det.className='msg reasoning';det.open=true;
  const sum=document.createElement('summary');sum.textContent='Reasoning';det.appendChild(sum);
  const c=document.createElement('div');c.textContent=content;det.appendChild(c);
  messagesEl.appendChild(det);scrollToBottom();return det;
}

function scheduleCodeHighlight(codeEl){
  if(codeEl._highlightScheduled)return;
  codeEl._highlightScheduled=true;
  const render=()=>{
    if(!document.body.contains(codeEl)){
      codeEl._highlightScheduled=false;
      return;
    }
    if(typeof hljs==='undefined'){
      setTimeout(render,50);
      return;
    }
    codeEl._highlightScheduled=false;
    delete codeEl.dataset.highlighted;
    hljs.highlightElement(codeEl);
  };
  requestAnimationFrame(render);
}

function createPrettyBlock(content,lang){
  const pre=document.createElement('pre');
  const codeEl=document.createElement('code');
  if(lang)codeEl.className='language-'+lang;
  let formatted=content;
  if(lang==='json'&&typeof content==='string'){
    try{formatted=JSON.stringify(JSON.parse(content),null,2)}catch{}
  }
  codeEl.textContent=formatted;
  pre.appendChild(codeEl);
  scheduleCodeHighlight(codeEl);
  return pre;
}

let codeactSpinnerEl=null;

function showCodeActSpinner(){
  if(codeactSpinnerEl)return;
  codeactSpinnerEl=document.createElement('div');
  codeactSpinnerEl.className='typing';
  codeactSpinnerEl.innerHTML='<span class="codeact-spinner"></span>CodeAct session<span>.</span><span>.</span><span>.</span>';
  messagesEl.appendChild(codeactSpinnerEl);
  scrollToBottom();
}

function hideCodeActSpinner(){
  if(codeactSpinnerEl){codeactSpinnerEl.remove();codeactSpinnerEl=null}
}

let codeactActiveEl=null;
let codeactStreamArgs='';
let codeactStreamToolId=null;
let lastWasCodeAct=false;

function addCodeActCall(args){
  let code='';
  if(typeof args==='string'){
    try{const p=JSON.parse(args);code=p.code||args}catch{code=args}
  }else{
    code=args&&typeof args.code==='string'?args.code:JSON.stringify(args,null,2);
  }
  showCodeActSpinner();
  const det=document.createElement('details');det.className='msg codeact';det.open=true;
  const sum=document.createElement('summary');
  sum.textContent='CodeAct session';
  det.appendChild(sum);
  det.appendChild(createPrettyBlock(code,'python'));
  messagesEl.appendChild(det);
  codeactActiveEl=det;
  lastWasCodeAct=true;
  scrollToBottom();
}

function decodePartialCodeArg(raw){
  const key=raw.match(/"code"\s*:\s*"/);
  if(!key||key.index===undefined)return raw;
  let i=key.index+key[0].length;
  let result='';
  while(i<raw.length){
    const ch=raw[i++];
    if(ch==='"')return result;
    if(ch!=='\\'){result+=ch;continue}
    if(i>=raw.length)break;
    const escaped=raw[i++];
    if(escaped==='n')result+='\n';
    else if(escaped==='r')result+='\r';
    else if(escaped==='t')result+='\t';
    else if(escaped==='b')result+='\b';
    else if(escaped==='f')result+='\f';
    else if(escaped==='u'){
      const hex=raw.slice(i,i+4);
      if(hex.length<4||!/^[0-9a-fA-F]{4}$/.test(hex))break;
      result+=String.fromCharCode(parseInt(hex,16));
      i+=4;
    }else if(escaped==='"'||escaped==='\\'||escaped==='/')result+=escaped;
    else result+=escaped;
  }
  return result;
}

function codeActPreviewContent(raw){
  try{
    const parsed=JSON.parse(raw);
    if(parsed&&typeof parsed.code==='string')return parsed.code;
  }catch{}
  return decodePartialCodeArg(raw);
}

function updateCodeActPreview(data){
  const meta=data.meta||{};
  if(meta.tool_name!=='execute')return false;
  const toolId=meta.tool_call_id||null;
  if(codeactStreamToolId&&toolId&&toolId!==codeactStreamToolId){
    codeactStreamArgs='';
    if(!document.body.contains(codeactActiveEl))codeactActiveEl=null;
  }
  if(!codeactActiveEl){addCodeActCall({code:''})}
  codeactStreamToolId=toolId;
  codeactStreamArgs+=data.content||'';
  const code=codeActPreviewContent(codeactStreamArgs);
  const codeEl=codeactActiveEl&&codeactActiveEl.querySelector('pre code');
  if(codeEl){
    codeEl.textContent=code;
    scheduleCodeHighlight(codeEl);
  }
  streamingPreviews.tool_call=codeactActiveEl;
  scrollToBottom();
  return true;
}

function finishCodeActSession(content){
  hideCodeActSpinner();
  if(codeactActiveEl){
    const spinner=codeactActiveEl.querySelector('.codeact-spinner');
    if(spinner)spinner.remove();
    const sum=codeactActiveEl.querySelector('summary');
    if(sum)sum.textContent='CodeAct session';
    codeactActiveEl=null;
  }
  if(content){
    const det=document.createElement('details');det.className='msg tool-result';det.open=true;
    const sum2=document.createElement('summary');sum2.textContent='Result';det.appendChild(sum2);
    det.appendChild(createPrettyBlock(content,null));
    messagesEl.appendChild(det);scrollToBottom();
  }
  codeactStreamArgs='';
  codeactStreamToolId=null;
  lastWasCodeAct=false;
}


function addToolCall(name,args){
   if(name==='execute'){
     addCodeActCall(args);return;
   }
   const argsStr=typeof args==='string'?args:JSON.stringify(args,null,2);
   const hasArgs=typeof args==='string'?args.length>0:Object.keys(args||{}).length>0;
   if(!hasArgs||!argsStr.includes('\n')){
     const div=document.createElement('div');div.className='msg tool-call';
     const label=document.createElement('div');label.textContent='Tool: '+name;div.appendChild(label);
     if(hasArgs)div.appendChild(createPrettyBlock(argsStr,'json'));
     messagesEl.appendChild(div);scrollToBottom();return;
   }
   addToolCallDetails(name,args);
}

function addToolCallDetails(name,args){
  const argsStr=typeof args==='string'?args:JSON.stringify(args,null,2);
  const det=document.createElement('details');det.className='msg tool-call';det.open=true;
  const sum=document.createElement('summary');sum.textContent='Tool: '+name;det.appendChild(sum);
  det.appendChild(createPrettyBlock(argsStr,'json'));
  messagesEl.appendChild(det);scrollToBottom();
}

function addToolResult(content){
   const value=typeof content==='string'?content:JSON.stringify(content,null,2);
   if(!value.includes('\n')){
     const div=document.createElement('div');div.className='msg tool-result';
     const label=document.createElement('div');label.textContent='Tool Result';div.appendChild(label);
     div.appendChild(createPrettyBlock(value,null));
     messagesEl.appendChild(div);scrollToBottom();return;
   }
   addToolResultDetails(value);
}

function addToolResultDetails(content){
  const det=document.createElement('details');det.className='msg tool-result';det.open=true;
  const sum=document.createElement('summary');sum.textContent='Tool Result';det.appendChild(sum);
  let lang=null;
  try{JSON.parse(content);lang='json'}catch{}
  det.appendChild(createPrettyBlock(content,lang));
  messagesEl.appendChild(det);scrollToBottom();
}

function addImageOutput(content){
  const div=document.createElement('div');div.className='msg image';
  try{
    const data=JSON.parse(content);
    if(data.url&&data.url.startsWith('data:image')){
      const img=document.createElement('img');img.src=data.url;img.style.maxWidth='300px';img.style.borderRadius='4px';
      div.appendChild(img);
    }else{
      div.textContent='Image: '+content;
    }
  }catch{div.textContent='Image: '+content}
  messagesEl.appendChild(div);scrollToBottom();
}

function addFileOutput(content){
  const div=document.createElement('div');div.className='msg file';
  try{
    const data=JSON.parse(content);
    const icon=document.createElement('span');icon.className='icon';icon.textContent='';div.appendChild(icon);
    const span=document.createElement('span');
    span.textContent=(data.filename||data.name||data.path||'file')+(data.size?' ('+data.size+' bytes)':'');
    div.appendChild(span);
  }catch{
    const icon=document.createElement('span');icon.className='icon';icon.textContent='';div.appendChild(icon);
    const span=document.createElement('span');span.textContent=content;div.appendChild(span);
  }
  messagesEl.appendChild(div);scrollToBottom();
}

function addPlaceholder(type){
  const div=document.createElement('div');div.className='msg assistant';
  const p=document.createElement('div');p.className='placeholder';
  p.textContent='['+type+']';div.appendChild(p);
  messagesEl.appendChild(div);scrollToBottom();
}

function addError(text){addMessage('error',text)}

function setProcessing(on){
  sendBtn.disabled=on;cancelBtn.style.display=on?'block':'none';
  statusEl.textContent=on?'Processing...':'Ready';
  if(on){showTyping()}else{hideTyping()}
}

function showTyping(){
  if(typingIndicator)return;
  typingIndicator=document.createElement('div');
  typingIndicator.className='typing';
  typingIndicator.innerHTML='Thinking<span>.</span><span>.</span><span>.</span>';
  messagesEl.appendChild(typingIndicator);
  scrollToBottom();
}

function hideTyping(){
  if(typingIndicator){typingIndicator.remove();typingIndicator=null}
}

function renderItem(item){
  hideTyping();
  const existing=streamingPreviews[item.item_type];
  if(existing){existing.remove();delete streamingPreviews[item.item_type]}
  switch(item.item_type){
    case 'reasoning':   addReasoning(item.content); break;
    case 'tool_call':
      try{const tc=JSON.parse(item.content);addToolCall(tc.tool_name||'unknown',tc.tool_args||{})}
      catch(e){addToolCall('tool',item.content)}
      break;
    case 'tool_call_result':
       if(lastWasCodeAct){try{const r=JSON.parse(item.content);finishCodeActSession(r.content)}catch(e){finishCodeActSession(item.content)}}
       else{try{const r=JSON.parse(item.content);addToolResult(r.content)}catch(e){addToolResult(item.content)}}
       break;
    case 'image_output': addImageOutput(item.content); break;
    case 'file_output':  addFileOutput(item.content); break;
    case 'image_input':  addPlaceholder('Image Input: '+item.content); break;
    case 'file_input':   addPlaceholder('File Input: '+item.content); break;
    default:             addMessage('assistant',item.content,'Assistant');
  }
}

function handleStreamChunk(data){
  hideTyping();
  const chunkType=data.item_type||'output';
  if(chunkType==='tool_call'&&updateCodeActPreview(data))return;
  let prev=streamingPreviews[chunkType];
  if(!prev){
    if(chunkType==='reasoning'){
      prev=addReasoning('');
    }else if(chunkType==='tool_call'){
      prev=document.createElement('details');
      prev.className='msg tool-call';
      prev.open=true;
      const sum=document.createElement('summary');
      sum.textContent='Tool: ...';
      prev.appendChild(sum);
      const c=document.createElement('div');
      c.textContent='';
      prev.appendChild(c);
      messagesEl.appendChild(prev);
      scrollToBottom();
    }else{
      prev=addMessage('assistant','','Assistant');
    }
    streamingPreviews[chunkType]=prev;
  }
  const contentEl=prev.querySelector('div:last-child')||prev;
  contentEl.textContent+=data.content;
  scrollToBottom();
}

function getMaxInputHeight(){
  const root=document.documentElement;
  const val=getComputedStyle(root).getPropertyValue('--input-max-height').trim();
  if(val.endsWith('vh')){return window.innerHeight*parseFloat(val)/100}
  return window.innerHeight/3;
}

async function send(){
  if(!authToken){showAuth();return}
  const text=inputEl.value.trim();if(!text)return;
  const gen=++sendGen;
  inputEl.value='';inputEl.style.height='auto';
  addMessage('user',text,'You');
  setProcessing(true);
  abortController=new AbortController();
  currentReader=null;
  cancelled=false;
  streamingPreviews={};
  codeactStreamArgs='';
  codeactStreamToolId=null;

  try{
    const resp=await fetch('/api/message',{
      method:'POST',
      headers:{'Content-Type':'application/json',...authHeaders()},
      body:JSON.stringify({session_id:sessionId,content:text,previous_external_id:lastExternalId}),
      signal:abortController.signal
    });

    const contentType=resp.headers.get('content-type')||'';

    if(contentType.includes('text/event-stream')){
      await handleSSE(resp);
    }else{
      await handleJSON(resp);
    }
  }catch(e){
    if(!cancelled){
      if(e.name==='AbortError'){addError('Cancelled')}
      else{addError('Network error: '+e.message)}
    }
  }finally{
    if(gen===sendGen){abortController=null;currentReader=null;setProcessing(false)}
  }
}

async function handleSSE(resp){
  const reader=resp.body.getReader();
  currentReader=reader;
  const decoder=new TextDecoder();
  let buffer='';

  try{
    while(!cancelled){
      const{value,done}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const lines=buffer.split('\n');
      buffer=lines.pop();

      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const payload=line.slice(6);
        try{
          const data=JSON.parse(payload);
          if(data.type==='done'||cancelled)continue;
          if(data.type==='error'){addError(data.error||'Server error');continue}
          if(data.type==='stream_chunk'){
            handleStreamChunk(data);continue
          }
          renderItem(data);
          if(data.external_id){lastExternalId=data.external_id}
          if(data.session_id&&!sessionId){sessionId=data.session_id}
        }catch{}
      }
    }
  }catch(e){
    if(!cancelled)throw e;
  }finally{
    if(currentReader===reader){currentReader=null}
  }

  if(!cancelled&&buffer.startsWith('data: ')){
    try{
      const data=JSON.parse(buffer.slice(6));
      if(data.type!=='done'){
        if(data.type==='stream_chunk'){handleStreamChunk(data)}
        else{renderItem(data);if(data.external_id){lastExternalId=data.external_id}}
      }
    }catch{}
  }
}

async function handleJSON(resp){
  if(resp.status===401){clearAuth();showAuth('Your session has expired. Sign in again.');return}
  if(!resp.ok){const e=await resp.json().catch(()=>({error:'HTTP '+resp.status}));addError(e.error||e.detail||'Error');return}
  const data=await resp.json();
  hideTyping();
  if(!sessionId){sessionId=data.session_id}
  if(data.items){for(const item of data.items){renderItem(item)}}
  if(data.last_external_id){lastExternalId=data.last_external_id}
}

function cancel(){
  if(cancelled)return;
  cancelled=true;
  addError('Cancelled');
  if(currentReader){currentReader.cancel();currentReader=null}
  if(abortController){abortController.abort();abortController=null}
  setProcessing(false);
}

function adjustInputHeight(){
  inputEl.style.height='auto';
  const maxH=getMaxInputHeight();
  inputEl.style.height=Math.min(inputEl.scrollHeight,maxH)+'px';
}

authForm.addEventListener('submit',async function(e){
  e.preventDefault();
  const username=authUsername.value.trim();
  const password=authPassword.value;
  authError.textContent='';
  if(authMode==='register'&&password!==authConfirm.value){authError.textContent='Passwords do not match';return}
  authSubmit.disabled=true;
  try{
    if(authMode==='register'){
      const response=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:inviteToken,username,password})});
      const data=await response.json().catch(()=>({}));
      if(!response.ok){authError.textContent=data.detail||'Registration failed';return}
      history.replaceState({},'',location.pathname);
      inviteToken=null;
      authMode='login';
      setAuthMode('login');
      authUsername.value=username;
      authPassword.value='';
      authError.textContent='Account created. Sign in with your new password.';
      return;
    }
    const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok){authError.textContent=data.detail||'Sign in failed';return}
    authToken=data.access_token;
    localStorage.setItem('commamatrix_auth_token',authToken);
    await loadCurrentUser();
    authForm.reset();
  }catch(error){authError.textContent='Network error: '+error.message}
  finally{authSubmit.disabled=false}
});

passwordBtn.addEventListener('click',function(){passwordError.textContent='';passwordForm.reset();passwordOverlay.classList.remove('hidden')});
document.getElementById('password-cancel').addEventListener('click',function(){passwordOverlay.classList.add('hidden')});
passwordForm.addEventListener('submit',async function(e){
  e.preventDefault();
  passwordError.textContent='';
  const next=document.getElementById('new-password').value;
  if(next!==document.getElementById('new-password-confirm').value){passwordError.textContent='Passwords do not match';return}
  try{
    const response=await authFetch('/api/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:document.getElementById('old-password').value,new_password:next})});
    const data=await response.json().catch(()=>({}));
    if(response.status===401){logout();return}
    if(!response.ok){passwordError.textContent=data.detail||'Password change failed';return}
    passwordOverlay.classList.add('hidden');
  }catch(error){passwordError.textContent='Network error: '+error.message}
});

inviteBtn.addEventListener('click',async function(){
  const response=await authFetch('/api/invite',{method:'POST'});
  const data=await response.json().catch(()=>({}));
  if(response.status===401){logout();return}
  if(!response.ok){addError(data.detail||'Could not create invitation');return}
  inviteUrl.textContent=data.url;
  inviteOverlay.classList.remove('hidden');
});
document.getElementById('invite-copy').addEventListener('click',async function(){await navigator.clipboard.writeText(inviteUrl.textContent);this.textContent='Copied';setTimeout(()=>{this.textContent='Copy link'},1200)});
document.getElementById('invite-close').addEventListener('click',function(){inviteOverlay.classList.add('hidden')});
logoutBtn.addEventListener('click',logout);

setAuthMode(authMode);
if(inviteToken){clearAuth();showAuth()}else{loadCurrentUser()}

sendBtn.addEventListener('click',send);
cancelBtn.addEventListener('click',cancel);
inputEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
inputEl.addEventListener('input',adjustInputHeight);
window.addEventListener('resize',adjustInputHeight);
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommaMatrix</title>
<base href="/ui/">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<div id="app-shell">
  <header>
    <button id="branch-open" class="mobile-only icon-button" type="button" aria-label="Open branches" title="Open branches">☰</button>
    <h1>CommaMatrix</h1>
    <span class="status" id="status">Sign in required</span>
    <div class="header-actions">
      <span class="status" id="user-label"></span>
      <button id="password-btn" type="button" hidden>Change password</button>
      <button id="invite-btn" type="button" hidden>Add user</button>
      <button id="logout-btn" type="button" hidden>Log out</button>
    </div>
  </header>
  <div id="workspace">
    <aside id="branch-panel" aria-label="Conversation branches">
      <div class="branch-panel-header">
        <div>
          <h2>Branches</h2>
          <p>Choose a conversation path</p>
        </div>
        <button id="branch-close" class="mobile-only icon-button" type="button" aria-label="Close branches" title="Close branches">×</button>
      </div>
      <button id="new-branch-btn" class="new-branch-btn" type="button">+ New branch</button>
      <div class="branch-tabs" role="tablist" aria-label="Branch filters">
        <button id="active-branches-btn" class="branch-tab active" type="button" role="tab" aria-selected="true">Active</button>
        <button id="deleted-branches-btn" class="branch-tab branch-trash" type="button" role="tab" aria-selected="false" aria-label="Deleted branches" title="Deleted branches">🗑</button>
      </div>
      <div id="branch-list" class="branch-list"></div>
    </aside>
    <main id="chat-column">
      <div id="messages"></div>
      <div id="input-area">
        <label class="sr-only" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
        <button id="send-btn" type="button">Send</button>
      </div>
    </main>
  </div>
</div>
<div id="branch-backdrop" class="mobile-only"></div>
<div class="auth-overlay hidden" id="auth-overlay" style="display:none">
  <div class="auth-card">
    <h2 id="auth-title">Sign in</h2>
    <p id="auth-description">Use your CommaMatrix account to connect to this agent.</p>
    <form id="auth-form">
      <label for="auth-username">Username</label>
      <input id="auth-username" autocomplete="username" required>
      <label for="auth-password">Password</label>
      <div class="password-field">
        <input id="auth-password" type="password" autocomplete="current-password" required>
        <button class="password-toggle" type="button" data-password-target="auth-password" aria-pressed="false">Show</button>
      </div>
      <label id="auth-confirm-label" for="auth-confirm" hidden>Confirm password</label>
      <input id="auth-confirm" type="password" autocomplete="new-password" hidden>
      <div class="auth-error" id="auth-error"></div>
      <button id="auth-submit" type="button">Sign in</button>
    </form>
  </div>
</div>
<div class="auth-overlay hidden" id="password-overlay">
  <div class="auth-card">
    <h2>Change password</h2>
    <p>Set a new password for the current account.</p>
    <form id="password-form">
      <label for="old-password">Current password</label>
      <div class="password-field">
        <input id="old-password" type="password" autocomplete="current-password" required>
        <button class="password-toggle" type="button" data-password-target="old-password" aria-pressed="false">Show</button>
      </div>
      <label for="new-password">New password</label>
      <div class="password-field">
        <input id="new-password" type="password" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-password-target="new-password" aria-pressed="false">Show</button>
      </div>
      <label for="new-password-confirm">Confirm new password</label>
      <div class="password-field">
        <input id="new-password-confirm" type="password" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-password-target="new-password-confirm" aria-pressed="false">Show</button>
      </div>
      <div class="auth-error" id="password-error"></div>
      <button type="submit">Change password</button>
      <button class="secondary" id="password-cancel" type="button">Cancel</button>
    </form>
  </div>
</div>
<div class="auth-overlay hidden" id="invite-overlay">
  <div class="auth-card">
    <h2>New user invitation</h2>
    <p>Give this one-time link to the person who should register.</p>
    <div class="auth-success" id="invite-url"></div>
    <button id="invite-copy" type="button">Copy link</button>
    <button class="secondary" id="invite-close" type="button">Close</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" async></script>
<script src="app.js?v=13" defer></script>
</body>
</html>

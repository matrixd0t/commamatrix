name: Publish installer release

on:
  push:
    branches:
      - master
    paths:
      - installer/windows/install.ps1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-release
  cancel-in-progress: true

jobs:
  publish:
    name: Publish installer release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move installer tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git push --force origin "${GITHUB_SHA}:refs/tags/latest"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > release-notes.md
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "CommaMatrix installer" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          else
            gh release create latest \
              --title "CommaMatrix installer" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi

      - name: Upload installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest installer/windows/install.ps1 --clobber

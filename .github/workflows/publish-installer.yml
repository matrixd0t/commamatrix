name: Publish installer release

on:
  push:
    branches:
      - master
    paths:
      - installer/windows/install.ps1

permissions:
  contents: write

concurrency:
  group: installer-release
  cancel-in-progress: true

jobs:
  publish:
    name: Publish installer release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Delete previous installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          fi

      - name: Move installer tag
        run: git push --force origin "${GITHUB_SHA}:refs/tags/latest"

      - name: Create installer release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git log -1 --pretty=%B > release-notes.md
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "CommaMatrix installer" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: Upload installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest installer/windows/install.ps1 --repo "$GITHUB_REPOSITORY" --clobber

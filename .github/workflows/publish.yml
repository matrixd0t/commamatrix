name: Publish package to PyPI

on:
  push:
    branches:
      - master
    paths:
      - pyproject.toml

permissions:
  contents: read
  id-token: write

jobs:
  check_version:
    name: Check project version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check whether the project version changed
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')

          if git cat-file -e "${{ github.event.before }}:pyproject.toml" 2>/dev/null; then
            previous_version=$(git show "${{ github.event.before }}:pyproject.toml" | python -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')
          else
            previous_version=""
          fi

          echo "Current version: ${current_version}"
          echo "Previous version: ${previous_version:-<none>}"
          if [[ "${current_version}" == "${previous_version}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"

  publish:
    if: needs.check_version.outputs.changed == 'true'
    needs: check_version
    name: Build and publish package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/commamatrix
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

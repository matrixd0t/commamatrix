name: Publish package or installer release

on:
  push:
    tags:
      - "v*"
      - "latest"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/commamatrix
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish installer release
    if: github.event_name == 'push' && github.ref == 'refs/tags/latest'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          echo "name=CommaMatrix installer" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%B > release-notes.md

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          name: ${{ steps.metadata.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: true
          # Add future release assets to the list below.
          files: |
            installer/windows/install.ps1

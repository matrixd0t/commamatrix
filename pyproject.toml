[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commamatrix"
version = "0.1.4"
description = "AI Agent Orchestration Framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic",
    "httpx2>=2.9.1,<3",
    "matrix-fn-schema>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/matrixd0t/commamatrix"
Repository = "https://github.com/matrixd0t/commamatrix"
Issues = "https://github.com/matrixd0t/commamatrix/issues"

[project.optional-dependencies]
# Optional integrations can be selected individually, for example:
# uv add "commamatrix[http,web]"
dotenv = ["python-dotenv"]
sqlite = ["aiosqlite"]
http = [
    "sse-starlette>=3.3,<4",
    "starlette",
    "uvicorn",
    "bcrypt",
    "PyJWT",
    "python-multipart",
]
web = [
    "ddgs>=9.14.4",
    "trafilatura>=2.1.0",
]
codeact = ["bm25s"]
planner = ["matrix-planner>=0.2.1"]
postgres = ["asyncpg"]
mcp = [
    "mcp>=2.0.0",
]

# All optional built-in integrations. Choose feature extras explicitly or
# install this complete set.
all = [
    "python-dotenv",
    "aiosqlite",
    "sse-starlette>=3.3,<4",
    "starlette",
    "uvicorn",
    "bcrypt",
    "PyJWT",
    "python-multipart",
    "ddgs>=9.14.4",
    "trafilatura>=2.1.0",
    "bm25s",
    "matrix-planner>=0.2.1",
    "asyncpg",
    "mcp>=2.0.0",
]

test = [
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
    "aiosqlite",
    "sse-starlette>=3.3,<4",
    "starlette",
    "uvicorn",
    "bcrypt",
    "PyJWT",
    "python-multipart",
    "ddgs>=9.14.4",
    "trafilatura>=2.1.0",
    "bm25s",
    "matrix-planner>=0.2.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
    "aiosqlite",
    "sse-starlette>=3.3,<4",
    "starlette",
    "uvicorn",
    "bcrypt",
    "PyJWT",
    "python-multipart",
    "ddgs>=9.14.4",
    "trafilatura>=2.1.0",
    "bm25s",
    "matrix-planner>=0.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["src/commamatrix"]

[tool.hatch.build]
include = ["src/commamatrix/**/*.py", "src/commamatrix/**/*.md", "src/commamatrix/**/*.html", "src/commamatrix/**/*.css", "src/commamatrix/**/*.js", "src/commamatrix/**/*.svg"]

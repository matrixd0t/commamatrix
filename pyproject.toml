[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commamatrix"
version = "0.1.0"
description = "AI Agent Orchestration Framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "bm25s",
    "matrix-fn-schema>=0.1.5",
    "aiosqlite",
    "aiofiles",
    "httpx",
    "python-dotenv",
    "trafilatura>=2.1.0",
    "ddgs>=9.14.4",
]

[project.optional-dependencies]
http = ["starlette", "uvicorn", "bcrypt", "PyJWT"]
postgres = ["asyncpg"]
test = ["pytest", "pytest-asyncio", "commamatrix[http]"]
all = ["commamatrix[http,postgres]"]

[dependency-groups]
dev = ["commamatrix[test]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["src/commamatrix"]

[tool.hatch.build]
include = ["src/commamatrix/**/*.py", "src/commamatrix/**/*.md", "src/commamatrix/**/*.html"]

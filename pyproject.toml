[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commamatrix"
version = "0.1.0"
description = "AI Agent Orchestration Framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "bm25s",
    "matrix-fn-schema",
    "aiosqlite",
    "aiofiles",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
postgres = ["asyncpg"]
test = ["pytest", "pytest-asyncio"]
all = ["commamatrix[postgres]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["src/commamatrix"]

[tool.hatch.build]
include = ["src/commamatrix/**/*.py", "src/commamatrix/**/*.md"]

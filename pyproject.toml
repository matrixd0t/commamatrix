[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commamatrix"
version = "0.1.0"
description = "AI Agent Orchestration Framework"
requires-python = ">=3.13"
dependencies = [
    "pydantic",
    "bm25s",
    "aiosqlite",
    "aiofiles",
    "httpx",
    "python-dotenv",
    "starlette",
    "uvicorn",
    "bcrypt",
    "PyJWT",
    "python-multipart",
    "trafilatura>=2.1.0",
    "ddgs>=9.14.4",
    "matrix-planner>=0.2.1",
    "matrix-fn-schema>=0.1.9",
]

[project.optional-dependencies]
postgres = ["asyncpg"]
test = ["pytest", "pytest-asyncio"]
all = ["commamatrix[postgres]"]

[dependency-groups]
dev = ["commamatrix[test]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["src/commamatrix"]

[tool.hatch.build]
include = ["src/commamatrix/**/*.py", "src/commamatrix/**/*.md", "src/commamatrix/**/*.html"]
